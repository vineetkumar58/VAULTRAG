name: Deploy VaultRAG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps into Lambda folders (for zipping)
        run: |
          for dir in ../lambdas/shared ../lambdas/ingestion ../lambdas/query ../lambdas/auth; do
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt" -t "$dir" --upgrade
            fi
          done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_pinecone_api_key: ${{ secrets.PINECONE_API_KEY }}
          TF_VAR_pinecone_index_host: ${{ secrets.PINECONE_INDEX_HOST }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}

      # Only apply on pushes to main, not on pull requests
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_pinecone_api_key: ${{ secrets.PINECONE_API_KEY }}
          TF_VAR_pinecone_index_host: ${{ secrets.PINECONE_INDEX_HOST }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
