<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VaultRAG</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="auth-screen" class="screen">
  <div class="auth-card">
    <h1>VaultRAG</h1>
    <p class="subtitle">Multi-tenant document Q&amp;A</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log In</button>
      <button class="tab-btn" data-tab="signup">Sign Up</button>
    </div>

    <form id="login-form" class="tab-panel active">
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Password" required />
      <button type="submit">Log In</button>
      <p class="error" id="login-error"></p>
    </form>

    <form id="signup-form" class="tab-panel">
      <input type="email" id="signup-email" placeholder="Email" required />
      <input type="password" id="signup-password" placeholder="Password" required />
      <input type="text" id="signup-org" placeholder="Organization name (new org) — leave blank if using an invite" />
      <input type="text" id="signup-invite" placeholder="Invite token (optional)" />
      <button type="submit">Sign Up</button>
      <p class="error" id="signup-error"></p>
    </form>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header class="topbar">
    <h2>VaultRAG</h2>
    <div class="topbar-right">
      <span id="tenant-label"></span>
      <button id="invite-btn">Invite teammate</button>
      <button id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="layout">
    <section class="sidebar">
      <h3>Documents</h3>
      <label class="upload-btn">
        + Upload document
        <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden />
      </label>
      <p id="upload-status"></p>
      <ul id="document-list"></ul>
    </section>

    <section class="chat">
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Ask a question about your documents..." autocomplete="off" required />
        <button type="submit">Ask</button>
      </form>
    </section>
  </main>
</div>

<div id="invite-modal" class="modal hidden">
  <div class="modal-content">
    <h3>Invite a teammate</h3>
    <input type="email" id="invite-email" placeholder="Teammate's email" />
    <button id="send-invite-btn">Generate invite</button>
    <p id="invite-result"></p>
    <button id="close-invite-modal">Close</button>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
